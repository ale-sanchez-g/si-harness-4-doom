[project]
name = "doom-harness"
version = "0.1.0"
description = "An LLM harness (Ollama) that plays Doom through the Doom API server"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Export traces to an OpenTelemetry collector / trace UI (Arize Phoenix, Jaeger...).
# Without it traces are still written locally to runs/<run>/traces.jsonl.
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
doom-harness = "doom_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doom_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
