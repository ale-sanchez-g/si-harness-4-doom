[project]
name = "doom-harness"
version = "0.1.0"
description = "An LLM harness (Ollama) that plays Doom through the Doom API server"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doom-harness = "doom_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doom_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
