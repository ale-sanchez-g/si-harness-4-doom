[project]
name = "doom-server"
version = "0.1.0"
description = "Turn-based Doom (ViZDoom) behind an HTTP API designed for LLM agents"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "vizdoom==1.3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
doom-server = "doom_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doom_server*"]

[tool.setuptools.package-data]
doom_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
